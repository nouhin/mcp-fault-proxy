[project]
name = "mcp-fault-proxy"
version = "0.1.0"
description = "A minimal fault-injecting proxy for MCP (Model Context Protocol) stdio servers"
readme = "README.md"
authors = [
    { name = "nouhin", email = "59204569+nouhin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
mcp-fault-proxy = "mcp_fault_proxy.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
